name: tciqrestclient tests

on:
  push:
    paths:
      - "tciqclient/**"
      - ".github/workflows/tciqrestclient-tests.yml"
  pull_request:
    paths:
      - "tciqclient/**"
      - ".github/workflows/tciqrestclient-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tciqrestclient with test extras
        working-directory: tciqclient
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: tciqclient
        run: pytest
